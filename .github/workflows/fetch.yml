name: Daily Forestry news fetch

on:
  schedule:
    # 16:00 UTC = noon EDT (UTC-4). GitHub Actions cron is always UTC and
    # does not follow DST, so this drifts to 11:00 AM EST (UTC-5) roughly
    # early Nov - mid March each year (~1hr, twice a year). Adjust the hour
    # below in the offseason if that matters; not automated to keep this
    # simple.
    - cron: "0 16 * * *"
  workflow_dispatch: {}

concurrency:
  group: newsdata-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python3 fetch_news.py

      - name: Commit and push updated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.csv output/.resolved_link_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily fetch: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
