name: Daily Forestry news fetch

on:
  schedule:
    # 16:05 UTC =~ noon EDT (UTC-4). Deliberately NOT on the hour - GitHub's
    # own docs call out the top of every hour as the worst contention window
    # for scheduled triggers (everyone else's cron fires there too); a
    # same-day run was created 3h17m late at exactly "0 16 * * *" before
    # this was changed. GitHub Actions cron is always UTC and does not
    # follow DST, so this drifts to ~11:05 AM EST (UTC-5) roughly early Nov -
    # mid March each year (~1hr, twice a year). Adjust the hour below in the
    # offseason if that matters; not automated to keep this simple.
    - cron: "5 16 * * *"
  workflow_dispatch: {}

concurrency:
  group: newsdata-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        env:
          NEWSDATA_API_KEY: ${{ secrets.NEWSDATA_API_KEY }}
        run: python3 fetch_news.py

      - name: Commit and push updated output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/*.csv output/.resolved_link_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily fetch: $(date -u +'%Y-%m-%d %H:%M UTC')"

          # A human push to main (workflow/config/keyword changes) while this
          # job was running - a ~45-70 min collection window - can land in
          # between our checkout and this push, making a plain `git push`
          # rejected as non-fast-forward. Rebase onto the latest main and
          # retry rather than lose a whole day's collected data. Safe here:
          # this job only ever touches output/*.csv and the link cache, so a
          # rebase over unrelated file changes applies cleanly; the rare case
          # of a genuine conflict (something else touched the same output
          # file) aborts cleanly and fails loud rather than force-pushing.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) - fetching and rebasing onto latest main..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase conflict against origin/main - aborting rather than force-pushing."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1
