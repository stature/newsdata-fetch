# Global filters - applied to EVERY keyword query
language = "en"        # ISO code; "" = no language filter
country  = "us,ca"     # comma-separated ISO country codes; "" = no country filter
category = ""          # "" = no category filter (Forestry keywords span many categories)

# Relevance / freshness
# Confirmed to exist in NewsData's API; not confirmed as free-tier-enabled.
# If the API rejects either, the script disables it after the first failure
# and keeps running rather than silently dropping every keyword.
sort           = "relevancy"  # "" = default (newest-first); NewsData's other option is "" for date
timeframe_hours = 24          # only articles from the last N hours (1-48); "" / 0 = no timeframe filter

# Optional source-quality filter - "" = no filter. Values: "top", "medium", "low".
# Not confirmed as free-tier-enabled; worth an experiment against the press-release
# / syndication-mill noise (prsync, zolmax, thelincolnianonline, etc.).
priority_domain = ""

# Some sources give a link to their own page rather than the real publisher
# URL. Both are resolved automatically; either can be turned off independently
# if it ever proves unreliable - the original link is always the fallback.
#
# Google News: opaque redirect token (news.google.com/rss/...). Resolved via
# an unofficial, reverse-engineered Google endpoint (the `googlenewsdecoder`
# package).
resolve_google_news_links   = true
google_news_decode_interval = 1   # seconds between decode calls (separate from throttle_seconds)

# NewsBreak: a real, working preview page (newsbreak.com/...) that embeds the
# real source URL inline - resolved with a plain page fetch + regex, no extra
# dependency.
resolve_newsbreak_links = true

# Bundle (bundle_app source_id): a curation app - each article page embeds
# the real source next to a "shorter_link" field - same plain fetch + regex
# approach, no extra dependency.
resolve_bundle_app_links = true

# Deterministic content filter - drops investor/stock-comparison syndication,
# obituaries, off-topic "forest"/"timber" homonyms (sports, recipes, tourism,
# etc.), and (via require_industry_anchor) anything with no genuine forestry/
# wood-industry term anywhere in title+description. Applied before a row is
# ever written - rejected articles never appear in the CSV. See
# fetch_news.py's filter_reason() for the exact rules.
content_filter_enabled  = true
require_industry_anchor = true   # the broadest/strongest rule; set false to loosen if it's over-filtering

# Explicit source blocklist - add any NewsData source_id, source_name (as it
# appears in the CSV), or bare domain here to drop everything from it,
# regardless of what else it might match. Matched case-insensitively. This is
# the list to edit yourself for "I never want to see source X again" - no
# code changes needed.
blocked_sources = ["prsync", "pr sync", "prsync.com"]

# Truncate the description column to at most this many characters (ellipsis
# included), breaking on a word boundary where possible. Applied last, after
# filtering/dedup - the content filter still sees the full untruncated text.
# 0 = no truncation.
summary_max_chars = 300

# Files
keywords_file = "keywords.txt"
output_dir    = "output"

# Behaviour
results_per_keyword = 10   # NewsData free tier returns 10 per request; do not raise on free
throttle_seconds    = 40   # free tier is 30 req/15min; 32s left ~zero margin (900s/32s = 28.1) and a
                            # real run at 87 keywords hit 30x 429s and lost 6 keywords entirely once
                            # retries started compounding within the same rolling window - 40s gives
                            # real headroom (900s/40s = 22.5) even with retries eating into the budget
prune_weeks         = 12   # delete weekly CSVs whose week ENDED more than this many weeks ago

# HTTP / retry (mostly for 429 rate-limit responses)
request_timeout = 30
max_retries     = 5
retry_backoff   = 5        # seconds; doubles each retry -> 5, 10, 20, 40, 80

# --- RSS side-collector (fetch_rss.py) -------------------------------------
# Niche industry media / corporate blogs NewsData.io doesn't index. Writes a
# SEPARATE weekly file: newsdata_<Mon>_to_<Sun>_RSS.csv, every row keyword =
# "(rss)". Lower-trust output meant for downstream AI review. Remove the
# feature by deleting fetch_rss.py + feeds.txt and this whole block.
rss_enabled                   = true
rss_feeds_file                = "feeds.txt"
rss_recency_hours             = 24     # steady-state lookback; first run of a new week backfills to that Monday
rss_max_entries_per_feed      = 40     # cap per feed per run, newest first
rss_require_industry_anchor   = false  # OFF: RSS sources are curated but broad - let the AI tool judge relevance
rss_cross_dedupe_with_newsdata = true  # skip entries already in that week's NewsData file
rss_feed_timeout              = 30
rss_feed_delay_seconds        = 2      # politeness pause between feeds
